[package]
name = "nail-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
agdb = "0.13.2"
agent-client-protocol = "1"
async-openai = { version = "0.41.3", features = ["chat-completion"] }
futures-util = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
