[package]
name = "nail-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "0.14.0"
schemars = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
async-openai = { version = "0.41", features = ["full"] }
futures = "0.3"
dotenvy = "0.15"
anyhow = "1.0"
surrealdb = { version = "3", features = ["kv-surrealkv"] }
once_cell = "1.19"
tempfile = "3"
rmcp = { version = "1.7.0", features = ["client", "server", "transport-io", "transport-async-rw" ] }
log = "0.4.32"
fern = "0.7.1"
chrono = "0.4.45"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
toml = "0.8"
ascon-hash = "0.4"
